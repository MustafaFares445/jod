name: CodeRabbit schema fix

on:
  push:
    branches:
      - mobile-branch

permissions:
  contents: write

jobs:
  patch-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-branch
      - name: Patch authentication response schema
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public/mobile-api.json')
          text = path.read_text()
          old = '''            "AuthenticationException": {
                "description": "Unauthenticated",
                "content": {
                    "application/json": {
                        "schema": {
                            "type": "object",
                            "properties": {
                                "message": {
                                    "type": "string",
                                    "description": "Error overview."
                                }
                            },
                            "required": [
                                "message"
                            ]
                        }
                    }
                }
            },'''
          new = '''            "AuthenticationException": {
                "description": "Unauthenticated",
                "content": {
                    "application/json": {
                        "schema": {
                            "type": "object",
                            "properties": {
                                "success": {
                                    "type": "boolean",
                                    "const": false
                                },
                                "message": {
                                    "type": "string",
                                    "description": "Error overview."
                                },
                                "data": {
                                    "type": "null"
                                },
                                "error": {
                                    "type": "object",
                                    "properties": {
                                        "code": {
                                            "type": "string",
                                            "const": "unauthenticated"
                                        },
                                        "message": {
                                            "type": "string"
                                        }
                                    },
                                    "required": [
                                        "code",
                                        "message"
                                    ]
                                }
                            },
                            "required": [
                                "success",
                                "message",
                                "data",
                                "error"
                            ]
                        }
                    }
                }
            },'''
          if old not in text:
              raise SystemExit('AuthenticationException schema block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit schema fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/mobile-api.json
          git commit -m "Document unauthenticated mobile error envelope"
          git push origin HEAD:mobile-branch
