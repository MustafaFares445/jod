name: Convert tests to Pest syntax

on:
  push:
    branches:
      - agent/convert-tests-to-pest-syntax

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/convert-tests-to-pest-syntax
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install project dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Pest Drift temporarily
        run: composer require pestphp/pest-plugin-drift --dev --with-all-dependencies --no-interaction

      - name: Convert PHPUnit tests to Pest syntax
        run: ./vendor/bin/pest --drift tests

      - name: Resolve colliding helper functions
        shell: bash
        run: |
          python3 <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re

          files = sorted(Path('tests').rglob('*Test.php'))
          declaration = re.compile(r'(?m)^\s*function\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(')
          declarations = defaultdict(list)

          for path in files:
              text = path.read_text()
              for name in declaration.findall(text):
                  declarations[name].append(path)

          for name, paths in sorted(declarations.items()):
              if len(paths) < 2:
                  continue

              print(f'Renaming duplicate helper {name}: {", ".join(str(path) for path in paths)}')
              for path in paths:
                  prefix = re.sub(r'(?<!^)(?=[A-Z])', '_', path.stem).lower()
                  replacement = f'{prefix}_{name}'
                  text = path.read_text()
                  text = re.sub(
                      rf'(?m)^(\s*function\s+){re.escape(name)}(\s*\()',
                      rf'\1{replacement}\2',
                      text,
                  )
                  text = re.sub(
                      rf'(?<!->)(?<!::)\b{re.escape(name)}\s*(?=\()',
                      replacement,
                      text,
                  )
                  path.write_text(text)
          PY

      - name: Restore dependency manifests
        run: git checkout -- composer.json composer.lock

      - name: Syntax-check converted tests
        run: find tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify Pest discovers converted suite
        run: ./vendor/bin/pest --list-tests

      - name: Commit converted tests and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/convert-tests-to-pest.yml
          git add tests
          if git diff --cached --quiet; then
            echo "No conversion changes produced."
            exit 1
          fi
          git commit -m "Convert tests to Pest syntax"
          git push origin HEAD:agent/convert-tests-to-pest-syntax
