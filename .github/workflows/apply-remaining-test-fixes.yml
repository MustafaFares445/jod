name: Apply Remaining Test Fixes

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test

      - name: Apply remaining fixes
        run: python3 .github/scripts/apply_remaining_test_fixes.py

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No fixes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "Fix remaining test failures"
          git push origin HEAD:test
