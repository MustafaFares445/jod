name: Migrate test suite to Pest

on:
  push:
    branches:
      - agent/migrate-to-pest

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/migrate-to-pest
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Replace PHPUnit with Pest
        run: |
          composer remove phpunit/phpunit --dev --no-update
          composer require pestphp/pest:^4.0 pestphp/pest-plugin-laravel:^4.0 --dev --with-all-dependencies

      - name: Add Pest bootstrap
        run: |
          cat > tests/Pest.php <<'PHP'
          <?php

          pest()->extend(Tests\TestCase::class)
              ->in('Feature');
          PHP

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/migrate-pest.yml
          git add composer.json composer.lock tests/Pest.php
          git commit -m "Migrate test suite to Pest"
          git push origin HEAD:agent/migrate-to-pest
